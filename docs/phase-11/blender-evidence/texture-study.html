<script type="module">
import * as THREE from 'three';import {KTX2Loader} from './codec/loaders/KTX2Loader.js';
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(512,512);renderer.outputColorSpace=THREE.LinearSRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,5);camera.position.z=1;const material=new THREE.MeshBasicMaterial(),mesh=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);scene.add(mesh);const target=new THREE.WebGLRenderTarget(512,512);renderer.setRenderTarget(target);
const warmupStart=performance.now();const warmup=new THREE.DataTexture(new Uint8Array([255,255,255,255]),1,1);warmup.needsUpdate=true;material.map=warmup;renderer.render(scene,camera);renderer.getContext().finish();const warmupMs=performance.now()-warmupStart;
window.runStudy=async()=>{let baseline;const rows=[];for(const [name,url] of [['png','../../../tools/blender/bakes/ore_normal.png'],['webp','./ore-normal.webp'],['atlas','./ore-atlas.webp'],['ktx2','./ore-normal.ktx2']]){
 const start=performance.now(),ktx=name==='ktx2'?new KTX2Loader().setTranscoderPath('./codec/libs/basis/').detectSupport(renderer):null;
 const map=await (ktx||new THREE.TextureLoader()).loadAsync(url);const loaded=performance.now();map.colorSpace=THREE.NoColorSpace;map.minFilter=map.magFilter=THREE.NearestFilter;if(name==='atlas')map.repeat.x=.5;if(name==='ktx2'){map.repeat.y=-1;map.offset.y=1;}
 material.map=map;material.needsUpdate=true;renderer.render(scene,camera);renderer.getContext().finish();const uploaded=performance.now();const pixels=new Uint8Array(512*512*4);renderer.readRenderTargetPixels(target,0,0,512,512,pixels);if(!baseline)baseline=pixels.slice();let squared=0,max=0;for(let i=0;i<pixels.length;i++){const d=pixels[i]-baseline[i];squared+=d*d;max=Math.max(max,Math.abs(d));}const mse=squared/pixels.length;

 }const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');return {shaderWarmupMs:warmupMs,orientation:"KTX2 upper-left container explicitly mapped to match PNG/WebP UV orientation",rows,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'unexposed',resources:performance.getEntriesByType('resource').filter(r=>r.name.includes('basis_transcoder')).map(r=>({name:r.name.split('/').at(-1),bytes:r.decodedBodySize,durationMs:r.duration}))};};
</script>
