name: Static demo checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - name: Validate the mission and network
        run: python3 data/validate_tunnel_network.py
      - name: Validate the cinematic experience
        run: python3 data/validate_experience.py
      - name: Validate isolated public reference assets
        run: python3 scripts/verify-lookdev-assets.py
      - name: Verify presentation cache versions
        run: python3 scripts/verify-presentation-version.py
      - name: Verify environment reference photos
        run: python3 scripts/verify-environment-previews.py
      - name: Verify immersive orbital assets
        run: python3 scripts/verify-orbital-assets.py
      - name: Verify authored Blender assets
        run: python3 scripts/verify-authored-assets.py
      - name: Verify cinematic visual assets
        run: python3 scripts/verify-visual-assets.py
      - name: Check tunnel-reference preparation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify recorded RL evidence
        run: python3 scripts/verify-rl-evidence.py
      - name: Verify recorded world-model evidence
        run: python3 scripts/verify-world-model-evidence.py
      - name: Verify bounded learning follow-up evidence
        run: python3 scripts/verify-policy-followup.py && python3 scripts/verify-world-followup.py
      - name: Verify recorded demo bundles
        run: python3 scripts/verify-recorded-demo.py
      - name: Verify offline CPU evidence
        run: python3 scripts/verify-offline-evidence.py
      - name: Test recorded playback adapter
        run: node --test scripts/tests/recorded-data.test.mjs scripts/tests/height-field.test.mjs
      - name: Check look-development module syntax
        run: node --check docs/phase-11/lookdev/study.js && node --check scripts/verify-lookdev.cjs
      - name: Check whitespace
        run: git diff --check
