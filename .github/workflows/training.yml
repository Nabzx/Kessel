name: CPU experiment checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "training/uv.lock"
      - name: Install locked CPU dependencies
        run: uv sync --locked --all-groups
      - name: Test experiment contracts and packaging
        run: uv run --locked --all-groups pytest
      - name: Run bounded CPU workload smoke check
        run: uv run --locked python -m kessel_training.benchmark --smoke --output /tmp/kessel-cpu-smoke.json
      - name: Check real loader PPO execution
        run: uv run --locked python -m kessel_training.core_smoke --num-envs 4 --rollout-steps 8 --updates 2 --output /tmp/kessel-ppo-core-smoke.json
      - name: Check checkpointed training command
        run: uv run --locked python -m kessel_training.train --until-update 2 --output /tmp/kessel-training-smoke
