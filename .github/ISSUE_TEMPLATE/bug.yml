name: Bug report
description: Something in the demo behaves differently from what the docs say.
labels: ["bug", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        This is for reproducible bugs specifically. A feature idea or
        something confusing has its own "Feedback or idea" template.

        Keep it to roughly one screen. State what you observed, not a
        guessed cause. Do not paste a proposed fix or a patch.

  - type: checkboxes
    id: confirm
    attributes:
      label: Before filing
      options:
        - label: This is a reproducible bug, not a feature request or idea.
          required: true
        - label: I searched open and closed issues and this is not a duplicate.
          required: true

  - type: textarea
    id: current
    attributes:
      label: What happened
      description: What you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Point at the doc, ADR, or ROADMAP phase that says otherwise, if you can.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Shortest reproduction
      description: The exact steps, from loading index.html.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Browser and version:
        - Device (desktop / phone model):
        - Hosted (Pages URL) or local file server:
    validations:
      required: true
