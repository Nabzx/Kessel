name: Feedback or idea
description: A feature idea, something confusing, or a direction you'd like to see - not a reproducible bug.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything that isn't a reproducible bug: a feature idea, something
        that confused you, a direction you'd like the demo to take.

        Keep it to roughly one screen.

  - type: textarea
    id: idea
    attributes:
      label: What's the idea, or what's confusing
      description: What you'd like to see, or what tripped you up.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What this would help, if you can say.
    validations:
      required: false
