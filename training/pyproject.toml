[project]
name = "kessel-training"
version = "0.1.0"
description = "CPU-first synthetic loader experiments, separate from the static demo"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2,<3", "torch>=2.9,<3"]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8,<10",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
